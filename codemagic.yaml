# Codemagic build of the unsigned WatchParty iPad/iPhone IPA (same steps as
# .github/workflows/ios-test-build.yml), for sideloading with Sideloadly or AltStore.
# Builds start manually only (no push trigger).

workflows:
  ipad-unsigned-ipa:
    name: iPad unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 27.1
      java: 17
      vars:
        IOS_CONFIGURATION: Release
        GRADLE_OPTS: -Dfile.encoding=UTF-8
        # linkReleaseFrameworkIosArm64 runs inside the Gradle JVM and needs far more
        # than 4.5 GB; the Kotlin daemon only compiles klibs and fits in 3 GB.
        KOTLIN_DAEMON_JVMARGS: -Xmx3072M
        NUVIO_GRADLE_JVMARGS: -Xmx10240M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024M
        NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx10240M
    cache:
      cache_paths:
        - ~/.konan
        - ~/.gradle/caches
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          java -version
          touch local.properties
          # Codemagic's ~/.gradle/gradle.properties caps the daemon at 3 GB and wins over
          # the project file; the iOS framework link needs much more.
          mkdir -p ~/.gradle
          touch ~/.gradle/gradle.properties
          sed -i '' -E '/^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs|kotlin\.native\.jvmArgs)=/d' ~/.gradle/gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx10240M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024M"
            echo "kotlin.daemon.jvmargs=-Xmx3072M"
            echo "kotlin.native.jvmArgs=-Xmx10240M"
          } >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties
          sysctl -n hw.memsize
      - name: Prepare iOS dependencies
        script: ./scripts/prepare-ios-dependencies.sh
      - name: Build unsigned IPA
        script: ./scripts/build-ios-ipa.sh
    artifacts:
      - build/ios-ipa/*.ipa
