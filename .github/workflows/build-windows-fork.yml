name: Build Windows MSI (fork)

# Manual build of the fork for personal use. Needs no upstream secrets: accounts and
# sync go to the WatchParty server, the TMDB key comes from the app's own settings.
# Optional secret NUVIO_LOCAL_PROPERTIES holds a local.properties file
# (e.g. your own TRAKT_CLIENT_ID / TRAKT_CLIENT_SECRET).

on:
  workflow_dispatch:
  push:
    branches: [desktop-livetv]

# contents: write publishes each build as a GitHub release; the app's updater installs it from there.
permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      # The WatchParty server answers the app's own Nuvio sync. The anon key is public: every
      # app request carries it, and it only allows signing in with an account.
      NUVIO_SUPABASE_URL: https://sync.mudworld.space
      NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJudXZpby13YXRjaHBhcnR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyMjU2MDAsImV4cCI6MjM5Nzk0NTYwMH0.GRt8FY_cs7h0KOysW54JQ4Wzuy4LEuLwPJlChCcQg9o
      LOCAL_PROPERTIES: ${{ secrets.NUVIO_LOCAL_PROPERTIES }}
      # Every build gets a higher version, so the MSI upgrades in place (same upgrade code) and the
      # in-app updater sees it as new. 0.2.N becomes MSI version 1.2.N, above the old 1.1.33.
      NUVIO_DESKTOP_VERSION_NAME: 0.2.${{ github.run_number }}
      NUVIO_DESKTOP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties
        shell: bash
        run: printf '%s\n' "${LOCAL_PROPERTIES}" > local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run desktop tests
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:desktopTest `
            --tests "com.nuvio.app.features.livetv.*" `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Name the MSI for the updater
        shell: bash
        run: |
          msi="$(find composeApp/build/compose -name '*.msi' | head -1)"
          mkdir -p release
          cp "$msi" "release/WatchParty-${NUVIO_DESKTOP_VERSION_NAME}-windows-x64.msi"
          ls -la release

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-fork-windows-x64
          path: release/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Publish release for the in-app updater
        if: github.ref == 'refs/heads/desktop-livetv'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NUVIO_DESKTOP_VERSION_NAME }}
          name: WatchParty PC ${{ env.NUVIO_DESKTOP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: Automatic build of ${{ github.sha }} (WatchParty PC). The app offers it under Settings, Updates.
          files: release/*.msi
          make_latest: true
